<polyline points="355.29999999999995,279.12 355.29999999999995,320.52" fill="none" stroke="#c94726" stroke-width="1.5" opacity="1"/>
<polyline points="309.4,300 370.6,300" fill="none" stroke="#c94726" stroke-width="1.5" opacity="1"/>
<polyline points="340.0,320.88 340.0,331.68 358.0,331.68 322.0,331.68" fill="none" stroke="#c94726" stroke-width="3" opacity="1"/>
<text x="74.0" y="383.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#182b3a" opacity="1.00000">Direct current</text>
<text x="74.0" y="464.0" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#536675" opacity="1.00000">The direction of current does not</text>
<text x="74.0" y="496.0" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#536675" opacity="1.00000">periodically reverse. PV panels supply DC.</text>
<rect x="652.0" y="235.0" width="576.0" height="340" rx="18" fill="#ffffff" opacity="1.00000" stroke="#dce2e4" stroke-width="1"/>
<polyline points="907.6,298.2 940.0,269.4 972.4,298.2" fill="none" stroke="#c94726" stroke-width="3" opacity="1"/>
<rect x="916.6" y="296.4" width="46.800000000000004" height="34.199999999999996" rx="0" fill="none" opacity="1.00000" stroke="#c94726" stroke-width="3"/>
<rect x="933.52" y="309.0" width="12.959999999999999" height="21.599999999999998" rx="0" fill="none" opacity="1.00000" stroke="#c94726" stroke-width="2.0999999999999996"/>
<text x="674.0" y="383.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#182b3a" opacity="1.00000">Alternating current</text>
<text x="674.0" y="464.0" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#536675" opacity="1.00000">Current periodically reverses direction.</text>
<text x="674.0" y="496.0" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#536675" opacity="1.00000">Grid-connected homes commonly use AC.</text>
