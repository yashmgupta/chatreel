name: Renderer checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install encoder and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r renderer-py/requirements.txt -r tests/requirements.txt
      - name: Test legacy and educational Python rendering
        run: |
          python -m unittest discover -s tests -p test_render.py -v
          python -m unittest discover -s tests -p test_education.py -v
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build render service
        run: docker build -f server/Dockerfile -t chatreel:ci .
      - name: Exercise shared Canvas, synthetic speech and MP4 validation
        run: |
          docker run --rm --init --memory=2g --cpus=2 --pids-limit=256 --shm-size=256m \
            --security-opt seccomp=server/chromium-seccomp.json -i chatreel:ci \
            python -c 'import json,sys; from server.worker import render_job; f=json.load(sys.stdin); f["voice"]="tts"; f["scenes"][0]["narration"]="Distance divided by time gives speed."; print(render_job(f,"/data/check"))' \
            < templates/equation.json
